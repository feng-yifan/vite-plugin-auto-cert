# Publish to npm using Trusted Publisher (OIDC), no npm token required.
#
# 触发：仅推送 tag 时发布，tag 名 = 版本号且不带 v 前缀（例如 1.1.0，需与 package.json 的 version 一致）。
# 参照 fengyifan/dsh-plugins 的标准发布作业。npm 侧已为该包配置 Trusted Publisher(OIDC)，免 token。
# 见 https://docs.npmjs.com/trusted-publishers
#
# npm 现行政策（2026-10 观测）：新包的 Trusted Publisher 配置属「未验证」，创建后 48 小时内
# 没有首次成功发布会过期，需要重建；push / release / workflow_dispatch 事件可用。

name: Publish to npm

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read
  id-token: write   # Required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      # npx npm@latest guarantees npm >= 11.5.1 (OIDC trusted publishing requirement);
      # Build 步骤已产出 dist，publish 时跳过生命周期脚本以免重复构建。
      - name: Publish
        run: npx -y npm@latest publish --provenance --access public --ignore-scripts
