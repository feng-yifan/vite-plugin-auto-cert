# Publish to npm using Trusted Publisher (OIDC), no npm token required
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  release:
    types: [ created ]
  push:
    branches:
      - main
    tags:
      - '*.*.*'

permissions:
  contents: read
  id-token: write   # Required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install
      - run: npm run build
      - run: npm publish   # npm CLI auto-authenticates via OIDC; provenance is automatic
